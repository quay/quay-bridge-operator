---
updates:
  - file: "downstream/manifests/quay-bridge-operator.clusterserviceversion.yaml"
    update_list:
      - search: "olm.skipRange: \">=3.5.x <3.6.0\""
        replace: "olm.skipRange: \">=3.18.0 <5.0.0\""
      - search: "name: quay-bridge-operator.v3.6.0"
        replace: "name: quay-bridge-operator.v5.0.0"
      - search: "version: 3.6.0"
        replace: "version: 5.0.0"
      - search: "    description: Enhance OCP using Red Hat Quay container registry\n"
        replace: "    description: Enhance OCP using Red Hat Quay container registry\n    operators.openshift.io/valid-subscription: '[\"OpenShift Platform Plus\", \"Red Hat Quay\"]'\n"
      - search: "  displayName: Quay Bridge Operator\n"
        replace: "  displayName: Red Hat Quay Bridge Operator\n"
      - search: "  maintainers:\n    - email: quay-devel@redhat.com\n      name: Quay Engineering Team\n"
        replace: "  maintainers:\n    - email: support@redhat.com\n      name: Red Hat\n"

external-images:
  - search: "quay.io/coreos/kube-rbac-proxy:v0.5.0"
    replace: "registry.redhat.io/openshift4/ose-kube-rbac-proxy-rhel9:latest"
