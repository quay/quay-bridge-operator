---
updates:
  - file: "downstream/manifests/quay-bridge-operator.clusterserviceversion.yaml"
    update_list:
      - search: "olm.skipRange: \">=3.5.x <3.6.0\""
        replace: "olm.skipRange: \">=3.18.0 <{FULL_VER}\""
      - search: "name: quay-bridge-operator.v3.6.0"
        replace: "name: quay-bridge-operator.v{FULL_VER}"
      - search: "  version: 3.6.0"
        replace: "  version: {FULL_VER}"
  - file: "quay-bridge-operator.package.yaml"
    update_list:
      - search: "currentCSV: quay-bridge-operator.v5.0.0"
        replace: "currentCSV: quay-bridge-operator.v{FULL_VER}"
external-images:
  - search: "quay.io/coreos/kube-rbac-proxy:v0.5.0"
    replace: "registry.redhat.io/openshift4/ose-kube-rbac-proxy-rhel9:latest"
