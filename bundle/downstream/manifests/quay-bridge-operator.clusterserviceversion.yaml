  install:
    spec:
      clusterPermissions:
        - rules:
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - ""
              resources:
                - namespaces
              verbs:
                - get
                - list
                - update
                - watch
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - create
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - ""
              resources:
                - serviceaccounts
              verbs:
                - create
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - build.openshift.io
              resources:
                - builds
              verbs:
                - create
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - image.openshift.io
              resources:
                - imagestreamimports
                - imagestreams
              verbs:
                - create
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - quay.redhat.com
              resources:
                - quayintegrations
              verbs:
                - create
                - delete
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - quay.redhat.com
              resources:
                - quayintegrations/finalizers
              verbs:
                - update
            - apiGroups:
                - quay.redhat.com
              resources:
                - quayintegrations/status
              verbs:
                - get
                - patch
                - update
            - apiGroups:
                - authentication.k8s.io
              resources:
                - tokenreviews
              verbs:
                - create
            - apiGroups:
                - authorization.k8s.io
              resources:
                - subjectaccessreviews
              verbs:
                - create
          serviceAccountName: quay-bridge-operator
      deployments:
        - name: quay-bridge-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                name: quay-bridge-operator
            strategy: {}
            template:
              metadata:
                labels:
                  name: quay-bridge-operator
              spec:
                containers:
                  - args:
                      - --secure-listen-address=0.0.0.0:8443
                      - --upstream=http://127.0.0.1:8080/
                      - --logtostderr=true
                      - --v=10
                    image: quay.io/coreos/kube-rbac-proxy:v0.5.0
                    name: kube-rbac-proxy
                    ports:
                      - containerPort: 8443
                        name: https
                    resources: {}
                  - args:
                      - --health-probe-bind-address=:8081
                      - --metrics-bind-address=127.0.0.1:8080
                      - --leader-elect
                    command:
                      - /manager
                    image: registry-proxy.engineering.redhat.com/rh-osbs/quay-quay-bridge-operator-rhel8:v3.6.0
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    ports:
                      - containerPort: 9443
                        name: webhook-server
                        protocol: TCP
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        cpu: 200m
                        memory: 512Mi
                      requests:
                        cpu: 200m
                        memory: 400Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                    volumeMounts:
                      - mountPath: /apiserver.local.config/certificates
                        name: apiservice-cert
                        readOnly: true
                securityContext:
                  runAsNonRoot: true
                serviceAccountName: quay-bridge-operator
                terminationGracePeriodSeconds: 10
                volumes:
                  - name: apiservice-cert
                    secret:
                      defaultMode: 420
                      items:
                        - key: tls.key
                          path: apiserver.key
                        - key: tls.crt
                          path: apiserver.crt
                      secretName: webhook-server-cert
      permissions:
        - rules:
            - apiGroups:
                - ""
                - coordination.k8s.io
              resources:
                - configmaps
                - leases
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
          serviceAccountName: quay-bridge-operator
    strategy: deployment
  installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
  keywords:
    - registry
    - containers
    - quay
  links:
    - name: Quay Bridge Operator
      url: http://quay.io
  maintainers:
    - email: quay-devel@redhat.com
      name: Quay Engineering Team
  maturity: alpha
  provider:
    name: Red Hat
  version: 3.6.0
  webhookdefinitions:
    - admissionReviewVersions:
        - v1
      containerPort: 443
      deploymentName: quay-bridge-operator
      failurePolicy: Fail
      generateName: quayintegration.quay.redhat.com
      rules:
        - apiGroups:
            - build.openshift.io
          apiVersions:
            - v1
          operations:
            - CREATE
            - UPDATE
          resources:
            - builds
      sideEffects: None
      targetPort: 9443
      type: MutatingAdmissionWebhook
      webhookPath: /admissionwebhook
